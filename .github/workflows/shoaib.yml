name: Kernel Build (Exynos9610)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device codename"
        type: choice
        required: true
        options: [m30s, a50]
        default: m30s
      variant:
        description: "Variant"
        type: choice
        required: true
        options: [oneui, aosp]
        default: oneui
      android:
        description: "Android version (Android 11 = OneUI 3.x)"
        type: choice
        required: true
        options: ["11", "12"]
        default: "11"
      root:
        description: "Root integration"
        type: choice
        required: true
        options: [magisk, kernelsu, none]
        default: magisk
      magisk_channel:
        description: "If root=magisk, channel"
        type: choice
        required: true
        options: [stable, canary]
        default: stable
      permissive:
        description: "Permissive kernel"
        type: boolean
        required: true
        default: false
      clean:
        description: "Clean build"
        type: boolean
        required: true
        default: true
      extra_args:
        description: "Extra args appended to build.sh"
        type: string
        required: false
        default: ""

  push:
    branches:
      - main
      - master
      - wip
      - "wip-*"
      - "android-*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      TZ: Asia/Kathmandu

      # IMPORTANT: helps scripts that download from GitHub API avoid rate limits
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}

      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 8G

      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github

    steps:
      - name: Checkout (submodules + LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bzip2 jq bc p7zip-full zip unzip rsync \
            build-essential flex bison libssl-dev libelf-dev \
            lib32stdc++6 libc6-dev-i386 libncurses5 \
            python3 python-is-python3 git ccache curl wget ca-certificates \
            git-lfs file

      - name: Pull Git LFS objects (if used)
        run: |
          set -euxo pipefail
          git lfs install
          git lfs pull || true

      - name: Cache (ccache + common toolchain dirs)
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            toolchains
            toolchain
            clang
            proton-clang
            prebuilts
            .download
          key: ${{ runner.os }}-exy9610-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-exy9610-${{ github.ref_name }}-
            ${{ runner.os }}-exy9610-

      - name: KernelSU setup (only if root=kernelsu)
        if: ${{ inputs.root == 'kernelsu' }}
        shell: bash
        run: |
          set -euxo pipefail
          git submodule update --init --recursive || true

          if [ ! -f drivers/kernelsu/Kconfig ]; then
            echo "drivers/kernelsu/Kconfig missing -> running KernelSU setup.sh"
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          fi

          test -f drivers/kernelsu/Kconfig

      - name: Preflight Magisk (helps debug broken magisk.zip)
        if: ${{ inputs.root == 'magisk' }}
        shell: bash
        run: |
          set -euxo pipefail

          # If repo contains a magisk.zip, ensure it is not a tiny HTML/text file.
          if [ -f usr/magisk/magisk.zip ]; then
            echo "Found usr/magisk/magisk.zip"
            ls -lah usr/magisk/magisk.zip
            file usr/magisk/magisk.zip || true

            # If it's tiny, show first bytes (usually reveals HTML/404/rate-limit)
            size=$(stat -c%s usr/magisk/magisk.zip)
            if [ "$size" -lt 2000 ]; then
              echo "magisk.zip is suspiciously small ($size bytes). Showing head:"
              head -c 300 usr/magisk/magisk.zip | cat -v || true
              echo
              echo "This usually means Magisk download/update returned an error page."
              echo "We continue; build.sh will attempt to update Magisk using GITHUB_TOKEN."
            fi
          else
            echo "No usr/magisk/magisk.zip present in tree; build.sh will fetch it."
          fi

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./build.sh

          DEVICE="${{ inputs.device }}"
          VARIANT="${{ inputs.variant }}"
          ANDROID="${{ inputs.android }}"
          ROOT="${{ inputs.root }}"
          MAGISK_CHANNEL="${{ inputs.magisk_channel }}"
          PERMISSIVE="${{ inputs.permissive }}"
          CLEAN="${{ inputs.clean }}"
          EXTRA="${{ inputs.extra_args }}"

          # Defaults for push runs
          DEVICE="${DEVICE:-m30s}"
          VARIANT="${VARIANT:-oneui}"
          ANDROID="${ANDROID:-11}"
          ROOT="${ROOT:-magisk}"
          MAGISK_CHANNEL="${MAGISK_CHANNEL:-stable}"
          PERMISSIVE="${PERMISSIVE:-false}"
          CLEAN="${CLEAN:-true}"
          EXTRA="${EXTRA:-}"

          CMD=( ./build.sh --automated --device "$DEVICE" --variant "$VARIANT" --android "$ANDROID" )

          if [[ "$ROOT" == "magisk" ]]; then
            if [[ "$MAGISK_CHANNEL" == "canary" ]]; then
              CMD+=( --magisk canary )
            else
              CMD+=( --magisk )
            fi
          elif [[ "$ROOT" == "kernelsu" ]]; then
            CMD+=( --kernelsu )
          fi

          if [[ "$PERMISSIVE" == "true" ]]; then
            CMD+=( --permissive )
          fi

          if [[ "$CLEAN" == "true" ]]; then
            CMD+=( --clean )
          fi

          if [[ -n "$EXTRA" ]]; then
            CMD+=( $EXTRA )
          fi

          echo "Running: ${CMD[*]}"
          ( "${CMD[@]}" ) 2>&1 | tee build.log

      - name: Collect artifacts
        if: ${{ always() }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release

          # logs
          [ -f build.log ] && cp -f build.log release/build.log || true

          # zip outputs (your repo commonly uses Mint*-*.zip)
          shopt -s nullglob
          z1=( Mint*-*.zip )
          if (( ${#z1[@]} )); then
            mv -f "${z1[@]}" release/
          else
            z2=( *.zip )
            (( ${#z2[@]} )) && mv -f "${z2[@]}" release/ || true
          fi

          # .config (save if exists anywhere)
          if [ -f .config ]; then
            cp -f .config release/kernel_config.txt
          else
            cfg="$(find . -maxdepth 6 -type f -name .config | head -n 1 || true)"
            [ -n "$cfg" ] && cp -f "$cfg" release/kernel_config.txt || true
          fi

          echo "=== release/ ==="
          ls -lah release || true

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.device || 'm30s' }}-${{ inputs.variant || 'oneui' }}-android${{ inputs.android || '11' }}-${{ inputs.root || 'magisk' }}-${{ github.run_number }}
          path: release/
          if-no-files-found: warn
